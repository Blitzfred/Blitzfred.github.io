<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Progress Steps</title>
</head>
<body>
    <!-- Auf unserem Dokument haben wir einen Container. Indem Container
     befindet sich ein Container für die Progress Anzeige der progress-container. Im Progress-container befinden sich 4 cirlce klassen einer davon ist am anfang active und eine progress id. die Progress id wird den fortschritt anzeigen als blauen balken. 
     
     Unter dem Progress Container sind 2 Buttons platziert. Der Prev Button wird als disabled initialisert, erscheint grau und kann nicht angeklickt werden. der Next button wird normal initialisert.-->

    <div class="container">
        <div class="progress-container">
            <div class="progress" id="progress"></div>
            <div class="circle active">1</div>
            <div class="circle">2</div>
            <div class="circle">3</div>
            <div class="circle">4</div>
        </div>

        <button class="btn" id="prev" disabled>Prev</button>
        <button class="btn" id="next" >Next</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
